name: Validate win_arm64 wheel (TEMP)

# TEMPORARY workflow for fork validation of the native windows-11-arm wheel build.
# It builds //python/dist:binary_wheel + :test_wheel via bare bazelisk on the ARM64
# runner and runs the packaged unit tests. It deliberately does NOT use
# protocolbuffers/protobuf-ci/bazel@v5 (that action mandates GCP/GAR auth, which
# forks don't have). The real `windows_arm64` job in test_upb.yml uses that action
# and therefore only runs on upstream; this workflow is the fork-runnable
# equivalent used to validate the build itself. Remove before merging upstream.

on:
  push:
    branches:
      - win-arm64-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_arm64:
    name: Windows ARM64 Python ${{ matrix.python-version }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      USE_BAZEL_VERSION: "9.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Install Bazelisk
        shell: bash
        run: npm install -g @bazel/bazelisk

      - name: Build win_arm64 binary + test wheels
        shell: bash
        run: |
          set -eux
          bazelisk build --config=windows_arm64 \
            --platforms=//build_defs:win-arm64 \
            --//python:limited_api=True --//python:python_version=311 \
            //python/dist:binary_wheel //python/dist:test_wheel

      - name: Install wheels and run unit tests
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip
          pip install tzdata
          pip install -r python/requirements.txt
          WHEELS=$(find bazel-bin/python/dist -name 'protobuf*.whl' -printf '%h\n' | head -1)
          echo "wheels dir: ${WHEELS}"
          ls -l "${WHEELS}"
          pip install -vvv --no-index --find-links "${WHEELS}" protobuf protobuftests
          python -c 'from google._upb import _message; assert "google._upb._message.MessageMeta" in str(_message.MessageMeta)'
          TESTS=$(pip show -f protobuftests | grep _test.py | grep --invert-match -e _pybind11_test.py -e proto_api_test.py | sed 's,[/\\],.,g' | sed -E 's,.py$,,g')
          for test in ${TESTS[@]}; do
            python -m unittest -v ${test}
          done
